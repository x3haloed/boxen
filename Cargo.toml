[package]
name = "boxen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A hospitable home for agents, across your machines"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
fs2 = "0.4"
libc = "0.2"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "json"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
sha2 = "0.10"

[features]
ape = ["dep:cosmo-build"]
inference-probe = []

[build-dependencies]
cosmo-build = { version = "=10.0.0", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = "=10.0.0"

[package.metadata.cosmo]
bin = "boxen"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# APE fusion requires the intermediate symbol tables.
strip = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cosmo)'] }
