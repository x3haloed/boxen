<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxen</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: .75rem; }
  input, select, textarea, button { font: inherit; box-sizing: border-box; padding: .5rem; }
  input, select, textarea { display: block; width: 100%; margin-top: .25rem; }
  button { margin: .75rem .5rem .25rem 0; cursor: pointer; }
  code, pre { overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; margin: .5rem 0; font: 14px ui-monospace, monospace; }
  article { border-top: 1px solid #ddd; padding: .75rem 0; }
  article strong { font-size: .85rem; }
  .meta { color: #555; font-size: .85rem; }
  #connection { min-height: 1.5rem; }
  [hidden] { display: none !important; }
</style>
<h1>Boxen</h1>
<details><summary>Machine identity</summary><code id="identity">Loading…</code></details>
<form id="connect">
  <label>Execute on<select id="peer" required></select></label>
  <label id="addressLabel">Peer address<input id="address" placeholder="machine.lan:42424"></label>
  <button id="connectButton">Connect / refresh threads</button>
</form>
<p id="connection" role="status" aria-live="polite">Loading…</p>
<p id="residentIssues" role="status"></p>
<label>Thread<select id="threads"><option value="">New anonymous thread</option></select></label>
<details><summary>Create a resident</summary>
<form id="createResident">
  <label>Name<input id="residentName" required maxlength="100"></label>
  <label>Resident working directory<input id="residentCwd" placeholder="/absolute/path/on/that/machine" required></label>
  <label>Resident model<input id="residentModel" placeholder="Executing machine’s configured default"></label>
  <label>Initial identity<textarea id="residentIdentity" rows="3"></textarea></label>
  <label>Initial memory<textarea id="residentMemory" rows="3"></textarea></label>
  <label>Continuity quota (bytes)<input id="residentQuota" type="number" min="1" max="262144" value="65536" required></label>
  <button id="createResidentButton">Create resident</button>
  <p id="createResidentStatus" role="status"></p>
</form>
</details>
<details id="residentDetails" hidden><summary>Resident identity and memory</summary>
  <p id="residentInfo" class="meta"></p>
  <form id="editResident">
    <label>Saved name<input id="editName" required maxlength="100"></label>
    <label>Saved identity<textarea id="editIdentity" rows="3"></textarea></label>
    <label>Saved memory<textarea id="editMemory" rows="4"></textarea></label>
    <label>Saved quota (bytes)<input id="editQuota" type="number" min="1" max="262144" required></label>
    <button id="saveResident">Save identity and memory</button>
    <button id="reloadResident" type="button">Reload stored values</button>
    <p id="residentEditStatus" role="status"></p>
  </form>
</details>
<form id="work">
  <label>Working directory on executing machine<input id="cwd" placeholder="/absolute/path/on/that/machine" required></label>
  <label>Backend<select id="backend"><option value="codex">Codex app-server</option></select></label>
  <label>Model<input id="model" placeholder="Executing machine’s configured default"></label>
  <p class="meta">Full access · files and tools belong to the executing machine.</p>
  <label id="subjectLabel" hidden>Subject<input id="mailSubject" value="Message" maxlength="256"></label>
  <label>Message<textarea id="prompt" rows="3" required></textarea></label>
  <button id="send">Start thread</button><button id="cancel" type="button" disabled>Cancel run</button>
  <button id="detach" type="button" disabled>Detach viewer</button>
</form>
<p id="runStatus" role="status" aria-live="polite"></p>
<p class="meta" id="location"></p>
<section id="messagesView" hidden aria-label="Mailbox messages">
  <h2>Messages</h2>
  <p id="mailStatus" role="status"></p>
  <button id="activateResident" type="button">Activate without a message</button>
  <label><input id="autoActivate" type="checkbox" style="display:inline;width:auto"> Activate automatically on new mail</label>
  <section id="mailMessages"></section>
</section>
<details id="activityView" open><summary id="activityTitle">Thread activity and response</summary>
<section id="transcript" aria-label="Execution activity"></section>
</details>
<details><summary>Connection test</summary>
  <button id="ping" type="button">Send test message</button><pre id="pingResult"></pre>
</details>
<script>
const $ = id => document.getElementById(id);
const token = location.hash.slice(1);
if (token) { sessionStorage.setItem('boxen-token', token); history.replaceState(null, '', '/'); }
const headers = {Authorization: 'Bearer ' + (token || sessionStorage.getItem('boxen-token') || ''), 'Content-Type':'application/json'};
let identity, target, records = [], selectedThread = '', currentRun = null, watcher, generation = 0, connected = false, submitting = false;
let items = new Map(), pending = new Map(), cursors = new Map();
const clientId=localStorage.getItem('boxen-client-id')||id();localStorage.setItem('boxen-client-id',clientId);
let mailMessages=new Map(),residentCursor=0,clientCursor=0,mailFetching=false;
let pendingMails={};try{pendingMails=JSON.parse(localStorage.getItem('boxen-pending-mails')||'{}');}catch{}
const mailKey=(destination,resident)=>destination.peer+':'+resident;
const savePendingMails=()=>localStorage.setItem('boxen-pending-mails',JSON.stringify(pendingMails));
let residents=[], editorRevision=0, residentBusy=false;
let pendingResident;try{pendingResident=JSON.parse(localStorage.getItem('boxen-pending-resident')||'null');}catch{}
let pendingStart = null, syncing = false, observing = false;
const pause = ms => new Promise(resolve=>setTimeout(resolve,ms));
function unauthorized(response) { if(response.status===401) { const error=new Error("Local authorization changed. Open the control URL printed by the daemon.");error.authorization=true;throw error; } }
function rememberSubmission() {
  if(pendingStart) localStorage.setItem('boxen-pending-start',JSON.stringify({target,spec:pendingStart}));
  else localStorage.removeItem('boxen-pending-start');
}
const terminal = status => ['completed','failed','cancelled','interrupted'].includes(status);
function id() { return [...crypto.getRandomValues(new Uint8Array(32))].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function save() { localStorage.setItem('boxen-controls',JSON.stringify({peer:$('peer').value,address:$('address').value,cwd:$('cwd').value,model:$('model').value,thread:selectedThread})); }
async function operation(request, destination=target) {
  const response = await fetch('/api/operation',{method:'POST',headers,signal:AbortSignal.timeout(12000),body:JSON.stringify({...destination,request})});
  unauthorized(response);
  if (!response.ok) {const error=new Error(await response.text());error.definitive=response.status===422;throw error;}
  return response.json();
}
function controls() {
  const active = currentRun && !terminal(currentRun.status);
  const resident=residents.find(r=>r.id===selectedThread);
  const pendingMail=target?pendingMails[mailKey(target,selectedThread)]:null;
  const submissionPending=!resident&&!!pendingStart;
  $('send').textContent = active ? 'Send to active run' : selectedThread ? 'Send follow-up' : 'Start thread';
  if(resident)$('send').textContent='Send message to '+resident.name;
  if(pendingMail?.resident===selectedThread)$('send').textContent='Retry original message';
  $('subjectLabel').hidden=!resident;
  $('activateResident').disabled=!connected||syncing||submitting||!!active;
  $('autoActivate').disabled=!connected||syncing||residentBusy;
  if(resident)$('autoActivate').checked=resident.auto_activate;
  $('send').disabled = !connected || syncing || submitting || residentBusy;
  $('model').disabled=!!resident;
  $('createResidentButton').disabled=!connected||residentBusy||submitting;
  $('createResidentButton').textContent=pendingResident?'Retry original resident creation':'Create resident';
  for(const input of $('createResident').querySelectorAll('input,textarea'))input.disabled=residentBusy||!!pendingResident;
  for(const input of $('editResident').querySelectorAll('input,textarea,button'))input.disabled=!connected||syncing||residentBusy;
  if(resident)$('residentInfo').textContent='Resident '+resident.id+' · machine '+resident.machine_id+' · stored revision '+resident.revision+' · '+resident.used_bytes+' / '+resident.quota_bytes+' bytes · editor based on revision '+editorRevision;
  $('peer').disabled=submitting||residentBusy;$('address').disabled=submitting||residentBusy;$('threads').disabled=!connected||submitting||residentBusy;$('connectButton').disabled=submitting||residentBusy;
  $('prompt').disabled = submissionPending||pendingMail?.resident===selectedThread;
  $('mailSubject').disabled=pendingMail?.resident===selectedThread;
  if(submissionPending)$('send').textContent='Retry original submission';
  $('cancel').disabled = !active || !connected || syncing;
  $('cwd').disabled = !!selectedThread || !!pendingStart; $('model').disabled = !!resident || !!active || !!pendingStart;
  $('detach').disabled = !observing;
  for(const panel of pending.values())for(const input of panel.querySelectorAll('button,input,textarea'))input.disabled=!connected||syncing;
}
function add(label,text,meta='') {
  const article = document.createElement('article');
  const title = document.createElement('strong'); title.textContent=label;
  const content = document.createElement('pre');content.textContent=text;
  article.append(title,content);
  if(meta) { const small=document.createElement('div');small.className='meta';small.textContent=meta;article.append(small); }
  $('transcript').append(article); return {article,title,content};
}
function itemFor(run,itemId,label='Activity') {
  const key=run+':'+itemId;
  if(!items.has(key)) items.set(key,add(label,''));
  return items.get(key);
}
function itemText(item) {
  if(item.type==='reasoning') return (item.summary||[]).join('\n\n');
  if(item.type==='commandExecution') return [item.command,item.aggregatedOutput].filter(Boolean).join('\n\n');
  if(item.type==='agentMessage' || item.type==='userMessage') return item.text || (item.content||[]).map(c=>c.text||'').join('\n');
  if(item.type==='plan') return item.text||JSON.stringify(item,null,2);
  return JSON.stringify(item,null,2);
}
const labels={agentMessage:'Agent',userMessage:'You',reasoning:'Thinking',commandExecution:'Command',mcpToolCall:'Tool call',dynamicToolCall:'Tool call',fileChange:'File changes',webSearch:'Web search',plan:'Plan'};
function answerPanel(run,message) {
  const key=run+':'+JSON.stringify(message.id);
  if(pending.has(key)) return;
  const method=message.method, params=message.params||{};
  const row=add('Input requested', params.reason || params.command || method);
  const body=document.createElement('pre');body.textContent=JSON.stringify(params,null,2);row.article.append(body);
  async function respond(result) {
    try { await operation({op:'control',id:run,action:{type:'respond',request_id:message.id,result}}); }
    catch(error){ $('runStatus').textContent=error.message; }
  }
  if(method==='item/commandExecution/requestApproval'||method==='item/fileChange/requestApproval') {
    for(const decision of ['accept','decline','cancel']) {
      const button=document.createElement('button');button.textContent=decision;button.onclick=()=>respond({decision});row.article.append(button);
    }
  } else if(method==='item/tool/requestUserInput'||method==='tool/requestUserInput') {
    const questions=[];
    for(const question of params.questions||[]) {
      const label=document.createElement('label');label.textContent=question.question;
      const input=document.createElement('input');
      if(question.options?.length){ input.placeholder=question.options.map(o=>o.label).join(' / '); }
      label.append(input); row.article.append(label);questions.push({id:question.id,input});
    }
    const button=document.createElement('button');button.textContent='Reply';button.onclick=()=>respond({answers:Object.fromEntries(questions.map(q=>[q.id,{answers:[q.input.value]}]))});row.article.append(button);
  } else {
    const input=document.createElement('textarea');input.setAttribute('aria-label','Backend response JSON');input.placeholder='Response JSON for this backend request';
    const button=document.createElement('button');button.textContent='Send response';button.onclick=()=>{try{respond(JSON.parse(input.value));}catch(error){$('runStatus').textContent=error.message;}};
    row.article.append(input,button);
  }
  pending.set(key,row.article);
}
function resolveRequest(run,requestId) {
  const key=run+':'+JSON.stringify(requestId), panel=pending.get(key);
  if(panel){panel.remove();pending.delete(key);}
}
function render(run,event) {
  if(event.kind==='status') {
    $('runStatus').textContent=(records.find(r=>r.record.spec.id===run)?.record.resident?'Activation ':'')+event.data.status + (event.data.detail && event.data.detail!=='null' ? ' · '+event.data.detail:'');
    if(terminal(event.data.status)) {
      for(const [key,panel] of pending)if(key.startsWith(run+':')){panel.remove();pending.delete(key);}
      if(event.data.status!=='completed')for(const [key,row] of items)if(key.startsWith(run+':')&&!row.completed)row.title.textContent=row.title.textContent.replace(' · inProgress','')+' · interrupted with turn';
    }
    return;
  }
  if(event.kind==='resident_context'){add('Resident continuity','Revision '+event.data.revision+' · host '+event.data.machine_id);return;}
  if(event.kind==='resident_tool_result'){
    if(event.data.tool&&event.data.tool!=='boxen_continuity'){add(event.data.tool+' · '+(event.data.success?'completed':'rejected'),JSON.stringify(event.data.result,null,2));refreshMailbox(generation,{...target});return;}
    const result=event.data.result,row=itemFor(run,event.data.call_id||event.data.request_id,'Continuity');
    row.title.textContent=event.data.success?(event.data.action==='write'?'Continuity saved':'Continuity read'):'Continuity update rejected';
    row.content.textContent=event.data.success?'Revision '+result.revision+' · '+result.used_bytes+' / '+result.quota_bytes+' bytes\nIdentity: '+result.identity+'\nMemory: '+result.memory:result.error;
    if(event.data.success)residents=residents.map(r=>r.id===result.id&&r.revision<=result.revision?result:r);
    return;
  }
  if(event.kind==='recovery_notice'){add('Recovery notice',event.data.detail);return;}
  if(event.kind==='backend_session_rebuilt'){add('Backend session rebuilt',event.data.detail);return;}
  if(event.kind==='activation_input'){add('Activation input · private',event.data.text);return;}
  if(event.kind==='user_message') { add('You',event.data.text);return; }
  if(event.kind==='request_answered'){resolveRequest(run,event.data.request_id);return;}
  if(event.kind==='control'){if(event.data.text)add('You · steering',event.data.text);else add('Control',event.data.type);return;}
  if(event.kind==='control_error'){add('Control error',event.data.message);return;}
  if(event.kind!=='backend')return;
  const message=event.data, method=message.method, params=message.params||{};
  if(message.id!==undefined){if(method==='item/tool/call'&&['boxen_continuity','boxen_mailbox','boxen_send_message','boxen_thread_request','boxen_thread_result'].includes(params.tool)&&records.find(r=>r.record.spec.id===run)?.record.spec.resident_id)return;answerPanel(run,message);return;}
  if(method==='serverRequest/resolved'){resolveRequest(run,params.requestId);return;}
  if(method==='item/started'||method==='item/completed') {
    const item=params.item||{};
    const label=item.type==='agentMessage'&&records.find(r=>r.record.spec.id===run)?.record.resident?'Private narration':labels[item.type]||item.type||'Activity';
    if(item.type==='userMessage'||(item.type==='dynamicToolCall'&&['boxen_continuity','boxen_mailbox','boxen_send_message','boxen_thread_request','boxen_thread_result'].includes(item.tool)))return;
    const row=itemFor(run,item.id,label);
    row.title.textContent=label+(item.status?' · '+item.status:'');
    row.completed=method==='item/completed';
    const text=itemText(item);
    if(text || method==='item/completed')row.content.textContent=text;
    return;
  }
  if(method?.endsWith('Delta')||method?.endsWith('/delta')) {
    const label=method.includes('reasoning')?'Thinking':method.includes('agentMessage')?(records.find(r=>r.record.spec.id===run)?.record.resident?'Private narration':'Agent'):method.includes('commandExecution')?'Command':'Activity';
    const row=itemFor(run,params.itemId,label);
    if(method.includes('outputDelta')&&!row.hasOutput){row.content.append(document.createTextNode('\n\n'));row.hasOutput=true;}
    row.content.append(document.createTextNode(params.delta||''));return;
  }
  if(method==='turn/plan/updated'){add('Plan',(params.plan||[]).map(p=>p.status+' · '+p.step).join('\n'));return;}
  if(method==='turn/diff/updated'){add('Changes',params.diff||'');return;}
  if(method==='error'){add('Backend error',JSON.stringify(params.error||params,null,2));return;}
  if(method?.startsWith('item/')||method?.includes('progress')) {
    const details=document.createElement('details'), summary=document.createElement('summary'),pre=document.createElement('pre');
    summary.textContent=method;pre.textContent=JSON.stringify(params,null,2);details.append(summary,pre);$('transcript').append(details);
  }
}
function displayMessages() {
  const presented=new Map();for(const run of records)for(const message of run.record.mailbox?.message_ids||[])presented.set(message,run.record.spec.id);
  const resident=residents.find(r=>r.id===selectedThread);$('mailMessages').replaceChildren();
  for(const message of [...mailMessages.values()].sort((a,b)=>a.seq-b.seq)){
    const article=document.createElement('article'),title=document.createElement('strong'),body=document.createElement('pre'),status=document.createElement('div');
    const outgoing=message.sender.type==='client';
    title.textContent=(outgoing?'You → '+(resident?.name||'Resident'):(resident?.name||'Resident')+' → You')+' · '+message.subject;
    body.textContent=message.body;status.className='meta';status.textContent=(outgoing?(presented.has(message.id)?'Presented in activation '+presented.get(message.id).slice(0,12):'Queued in resident mailbox'):'Queued in your inbox')+(message.in_reply_to?' · Reply to '+message.in_reply_to.slice(0,12):'');
    article.append(title,body,status);$('mailMessages').append(article);
  }
}
async function refreshMailbox(gen,destination) {
  const resident=selectedThread;if(!residents.some(r=>r.id===resident)||mailFetching)return;
  mailFetching=true;
  try{
    const [incoming,outgoing]=await Promise.all([operation({op:'resident_inbox',id:resident,after:residentCursor},destination),operation({op:'client_inbox',client_id:clientId,after:clientCursor},destination)]);
    if(gen!==generation||selectedThread!==resident)return;
    residentCursor=incoming.next_after;clientCursor=outgoing.next_after;
    for(const message of incoming.messages)if(message.sender.type==='client'&&message.sender.id===clientId){mailMessages.set(message.id,message);const key=mailKey(destination,resident),unconfirmed=pendingMails[key];if(unconfirmed?.message.id===message.id){delete pendingMails[key];savePendingMails();if($('prompt').value===unconfirmed.message.body)$('prompt').value='';controls();}}
    for(const message of outgoing.messages)if(message.sender.type==='resident'&&message.sender.id===resident)mailMessages.set(message.id,message);
    displayMessages();$('mailStatus').textContent='Messages are separate from private execution activity. A finished activation does not imply a reply.';
  }catch(error){if(gen===generation)$('mailStatus').textContent='Mailbox connection unavailable · '+error.message;}
  finally{mailFetching=false;}
}
function updateThreads() {
  const latest=new Map(), titles=new Map();for(const record of records){const thread=record.record.spec.thread_id;latest.set(thread,record);if(!titles.has(thread))titles.set(thread,record.record.spec.prompt);}
  $('threads').replaceChildren(new Option('New anonymous thread',''));
  for(const resident of residents){const status=latest.get(resident.id)?.status;const home=!status||status==='completed'?'at home':terminal(status)?'at home · last activation '+status:status;$('threads').append(new Option('Resident: '+resident.name+' · '+home,resident.id));}
  for(const [thread,record] of [...latest].reverse())if(!residents.some(r=>r.id===thread))$('threads').append(new Option(titles.get(thread).slice(0,55)+' · '+record.status,thread));
  $('threads').value=selectedThread;
}
function loadResidentEditor() {
  const resident=residents.find(r=>r.id===selectedThread);
  $('residentDetails').hidden=!resident;
  if(!resident)return;
  editorRevision=resident.revision;
  $('editName').value=resident.name;$('editIdentity').value=resident.identity;$('editMemory').value=resident.memory;$('editQuota').value=resident.quota_bytes;
  $('residentEditStatus').textContent='';
}
// The executing daemon owns the history. Cursors belong to this rendered view:
// reopening rebuilds from zero; reconnecting continues after the last applied event.
async function watch(run, gen, destination) {
  let after=cursors.get(run)||0, attempt=0;
  while(gen===generation) {
    const controller=new AbortController();watcher=controller;controls();
    let reader, timer;
    const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>controller.abort(),12000);};
    try {
      arm();
      const response=await fetch('/api/watch',{method:'POST',headers,signal:controller.signal,body:JSON.stringify({...destination,request:{id:run,after}})});
      unauthorized(response);
      if(!response.ok)throw new Error(await response.text());
      reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';let done=false;
      while(gen===generation) {
        const chunk=await reader.read();if(gen!==generation)return;if(chunk.done)break;
        arm();buffer+=decoder.decode(chunk.value,{stream:true});
        let newline;
        while((newline=buffer.indexOf('\n'))>=0){
          const batch=JSON.parse(buffer.slice(0,newline));buffer=buffer.slice(newline+1);
          if(batch.error)throw new Error(batch.error);
          for(const event of batch.events||[]) {
            if(event.seq<=after)continue;
            if(event.seq!==after+1)throw new Error('Event sequence gap; reconnecting');
            render(run,event);after=event.seq;cursors.set(run,after);
          }
          currentRun=batch.snapshot;connected=true;attempt=0;
          // A snapshot can be ahead of a replay batch. Do not enable controls
          // until this view has caught up to the executing machine's journal.
          syncing=after<currentRun.last_seq || run!==records.filter(r=>r.record.spec.thread_id===selectedThread).at(-1)?.record.spec.id;
          $('connection').textContent=syncing?'Connected · replaying retained events':'Connected · live events';
          $('location').textContent='Executing machine: '+$('peer').selectedOptions[0].textContent+' · '+currentRun.record.spec.cwd+' · run '+run.slice(0,12)+' · event '+after;
          const index=records.findIndex(r=>r.record.spec.id===run);if(index>=0)records[index]=currentRun;
          updateThreads();controls();refreshMailbox(gen,destination);
          if(batch.done){done=true;break;}
        }
        if(done)break;
      }
      if(done)return;
      throw new Error('Event connection ended');
    } catch(error) {
      if(gen!==generation)return;
      connected=false;syncing=true;
      $('connection').textContent=error.authorization?error.message:'Machine unreachable; execution outcome unknown. Reconnecting… '+error.message;controls();
      if(error.authorization)return false;
      await pause(Math.min(500*2**attempt++,5000));
    } finally {
      clearTimeout(timer);controller.abort();
      if(reader)try{await reader.cancel();}catch{}
      if(watcher===controller)watcher=null;
    }
  }
}
function detach() { observing=false;generation++;watcher?.abort();watcher=null;syncing=false;controls(); }
function restorePending(destination) {
  let savedPending;try{savedPending=JSON.parse(localStorage.getItem('boxen-pending-start')||'null');}catch{}
  const candidate=savedPending?.target.peer===destination.peer?savedPending.spec:null;
  const residentView=residents.some(r=>r.id===selectedThread);
  pendingStart=candidate&&(candidate.resident_id?selectedThread===candidate.resident_id:!residentView&&(!selectedThread||selectedThread===candidate.thread_id))?candidate:null;
  if(!pendingStart)return;
  const accepted=records.find(r=>r.record.spec.id===pendingStart.id);
  if(accepted){selectedThread=accepted.record.spec.thread_id;pendingStart=null;rememberSubmission();}
  else if(pendingStart.resident_id){$('prompt').value=pendingStart.prompt;pendingStart=null;rememberSubmission();$('runStatus').textContent='The earlier direct resident submission has no retained run. Its text is restored; sending now queues a new mailbox message.';}
  else{$('cwd').value=pendingStart.cwd;$('model').value=pendingStart.model;$('prompt').value=pendingStart.prompt;$('runStatus').textContent='Prior submission is unconfirmed. Retry sends its original input and ID.';}
}
async function refreshRecords(gen,destination) {
  const [incoming,homes,issues]=await Promise.all([operation({op:'list'},destination),operation({op:'resident_list'},destination),operation({op:'resident_issues'},destination)]);
  if(gen!==generation)return false;
  records=incoming;residents=homes;
  $('residentIssues').textContent=issues.length?'Resident recovery incidents: '+issues.map(i=>i.id+' · '+i.detail+' · '+i.recovery).join(' | '):'';
  let recoveredResident=false;
  if(pendingResident?.target.peer===destination.peer&&residents.some(r=>r.id===pendingResident.spec.id)){selectedThread=pendingResident.spec.id;recoveredResident=true;pendingResident=null;localStorage.removeItem('boxen-pending-resident');$('createResidentStatus').textContent='Resident created.';}
  restorePending(destination);updateThreads();save();await refreshMailbox(gen,destination);
  if(recoveredResident){showThread(selectedThread);return false;}
  return true;
}
async function showThread(thread, refresh=false) {
  detach();selectedThread=thread;currentRun=null;items=new Map();pending=new Map();cursors=new Map();$('transcript').replaceChildren();$('runStatus').textContent='';$('location').textContent='';save();
  mailMessages=new Map();residentCursor=0;clientCursor=0;const residentView=residents.some(r=>r.id===thread);$('messagesView').hidden=!residentView;$('activityTitle').textContent=residentView?'Private execution activity (not sent messages)':'Thread activity and response';$('activityView').open=!residentView;$('mailMessages').replaceChildren();const unsent=target?pendingMails[mailKey(target,thread)]:null;if(unsent){$('prompt').value=unsent.message.body;$('mailSubject').value=unsent.message.subject;}
  observing=true;syncing=true;loadResidentEditor();controls();const gen=generation,destination={...target};let attempt=0;
  // Refresh the catalog after each terminal run and while idle. Progress itself
  // always comes from the ordered stream, never from snapshot polling.
  while(gen===generation) {
    try {
      if(refresh && !await refreshRecords(gen,destination))return;
      refresh=true;
      const related=records.filter(r=>r.record.spec.thread_id===selectedThread);
      const resident=residents.find(r=>r.id===selectedThread);
      if(resident){$('cwd').value=resident.cwd;$('model').value=resident.model;}
      if(related.length){$('cwd').value=related[0].record.spec.cwd;$('model').value=related.at(-1).record.spec.model;}
      syncing=true;controls();
      for(const record of related){
        if(gen!==generation)return;
        if(cursors.get(record.record.spec.id)===record.last_seq && terminal(record.status))continue;
        if(await watch(record.record.spec.id,gen,destination)===false)return;
      }
      if(gen!==generation)return;
      connected=true;syncing=false;attempt=0;
      $('connection').textContent='Connected · '+(related.length?'history up to date':'ready');controls();
      await pause(2000);
    }catch(error){
      if(gen!==generation)return;
      connected=false;syncing=true;
      $('connection').textContent=error.authorization?error.message:'Machine unreachable; last known state retained. Reconnecting… '+error.message;controls();
      if(error.authorization)return;
      await pause(Math.min(500*2**attempt++,5000));
    }
  }
}
async function connect() {
  detach();const gen=generation;target={peer:$('peer').value,address:$('address').value};const destination={...target};
  observing=true;save();$('connection').textContent='Connecting…';connected=false;syncing=true;controls();let attempt=0;
  while(gen===generation){
    try {
      if(!await refreshRecords(gen,destination))return;
      if(!records.some(r=>r.record.spec.thread_id===selectedThread)&&!residents.some(r=>r.id===selectedThread))selectedThread='';
      connected=true;updateThreads();save();showThread(selectedThread);return;
    }catch(error){
      if(gen!==generation)return;
      $('connection').textContent=error.authorization?error.message:'Machine unreachable; reconnecting… '+error.message;controls();
      if(error.authorization)return;
      await pause(Math.min(500*2**attempt++,5000));
    }
  }
}
$('connect').onsubmit=event=>{event.preventDefault();connect();};
$('threads').onchange=()=>showThread($('threads').value,true);
$('peer').onchange=()=>{detach();connected=false;selectedThread='';currentRun=null;pendingStart=null;records=[];residents=[];mailMessages.clear();$('messagesView').hidden=true;$('mailMessages').replaceChildren();updateThreads();$('transcript').replaceChildren();$('residentDetails').hidden=true;target={peer:$('peer').value,address:$('address').value};$('addressLabel').hidden=$('peer').value===identity;controls();};
$('work').onsubmit=async event=>{
  event.preventDefault();if(!connected||syncing)return;
  const gen=generation,destination={...target};
  const resident=residents.find(r=>r.id===selectedThread);
  const steering=!resident&&currentRun&&!terminal(currentRun.status);
  submitting=true;controls();
  try {
    const text=$('prompt').value;
    if(resident){
      const key=mailKey(destination,resident.id);let pendingMail=pendingMails[key];
      if(!pendingMail){pendingMail={target:destination,resident:resident.id,message:{id:id(),to:{type:'resident',id:resident.id},subject:$('mailSubject').value,body:text}};pendingMails[key]=pendingMail;savePendingMails();controls();}
      if(pendingMail.target.peer!==destination.peer||pendingMail.resident!==resident.id)throw new Error('An earlier message is unconfirmed at another destination. Its original ID remains available there.');
      const message=await operation({op:'mailbox_send',client_id:clientId,message:pendingMail.message},destination);
      delete pendingMails[key];savePendingMails();if(gen!==generation)return;
      mailMessages.set(message.id,message);displayMessages();$('prompt').value='';$('mailStatus').textContent='Saved in the resident mailbox; a reply is optional.';return;
    }
    if(steering) {
      await operation({op:'control',id:currentRun.record.spec.id,action:{type:'steer',text}});$('prompt').value='';return;
    }
    // Keep an uncertain submission's id and exact input so retry cannot duplicate it.
    if(!pendingStart) { const run=id();pendingStart={id:run,thread_id:selectedThread||run,resident_id:residents.some(r=>r.id===selectedThread)?selectedThread:null,backend:'codex',cwd:$('cwd').value,model:$('model').value,prompt:text}; rememberSubmission(); }
    const snapshot=await operation({op:'start',spec:pendingStart},destination);if(gen!==generation)return;pendingStart=null;rememberSubmission();
    if(!records.some(r=>r.record.spec.id===snapshot.record.spec.id))records.push(snapshot);selectedThread=snapshot.record.spec.thread_id;$('prompt').value='';
    updateThreads();save();showThread(selectedThread);
  }catch(error){if(resident){if(error.definitive){delete pendingMails[mailKey(destination,resident.id)];savePendingMails();}$('mailStatus').textContent=error.definitive?'Message rejected: '+error.message:'Message acceptance unconfirmed: '+error.message+'. Retry retains its original ID.';}else if(error.definitive){pendingStart=null;rememberSubmission();$('runStatus').textContent='Request rejected: '+error.message;}else{$('runStatus').textContent=steering?'Steering delivery unconfirmed: '+error.message+'. Inspect retained events before sending again.':'Submission not confirmed: '+error.message+'. Retrying submits the same run ID.';}}
  finally{submitting=false;controls();}
};
$('createResident').onsubmit=async event=>{
  event.preventDefault();if(!connected||residentBusy)return;
  residentBusy=true;controls();const destination={...target},gen=generation;
  try {
    if(pendingResident&&pendingResident.target.peer!==destination.peer)throw new Error('A resident creation is unconfirmed on another machine. Reconnect there to retry its original ID.');
    if(!pendingResident){pendingResident={target:destination,spec:{id:id(),name:$('residentName').value,cwd:$('residentCwd').value,model:$('residentModel').value,identity:$('residentIdentity').value,memory:$('residentMemory').value,quota_bytes:Number($('residentQuota').value)}};localStorage.setItem('boxen-pending-resident',JSON.stringify(pendingResident));}
    const resident=await operation({op:'resident_create',spec:pendingResident.spec},destination);
    pendingResident=null;localStorage.removeItem('boxen-pending-resident');
    if(gen!==generation)return;
    if(!residents.some(r=>r.id===resident.id))residents.push(resident);
    $('createResidentStatus').textContent='Resident created. It is at home; no run was started.';
    selectedThread=resident.id;updateThreads();showThread(selectedThread);
  }catch(error){if(error.definitive){pendingResident=null;localStorage.removeItem('boxen-pending-resident');}$('createResidentStatus').textContent=error.message;}
  finally{residentBusy=false;controls();}
};
$('editResident').onsubmit=async event=>{
  event.preventDefault();if(!connected||residentBusy)return;
  residentBusy=true;controls();const residentId=selectedThread,destination={...target};
  try{
    const updated=await operation({op:'resident_update',id:residentId,patch:{expected_revision:editorRevision,name:$('editName').value,identity:$('editIdentity').value,memory:$('editMemory').value,quota_bytes:Number($('editQuota').value)}},destination);
    if(selectedThread!==residentId||target.peer!==destination.peer)return;
    residents=residents.map(r=>r.id===residentId?updated:r);editorRevision=updated.revision;updateThreads();$('residentEditStatus').textContent='Saved revision '+updated.revision;
  }catch(error){$('residentEditStatus').textContent=error.message+' · Your edits are retained; reload stored values before reconciling and retrying.';}
  finally{residentBusy=false;controls();}
};
$('reloadResident').onclick=async()=>{
  const residentId=selectedThread,destination={...target};
  try{const resident=await operation({op:'resident_get',id:residentId},destination);if(selectedThread!==residentId||target.peer!==destination.peer)return;residents=residents.map(r=>r.id===residentId?resident:r);loadResidentEditor();controls();}catch(error){$('residentEditStatus').textContent=error.message;}
};
$('activateResident').onclick=async()=>{
  const activation=id();try{await operation({op:'resident_activate',id:selectedThread,activation_id:activation});$('mailStatus').textContent='Independent activation accepted; no reply is required.';}catch(error){$('mailStatus').textContent=error.message;}
};
$('autoActivate').onchange=async()=>{
  const resident=residents.find(r=>r.id===selectedThread);if(!resident)return;
  try{const updated=await operation({op:'resident_update',id:resident.id,patch:{expected_revision:resident.revision,auto_activate:$('autoActivate').checked}});residents=residents.map(r=>r.id===updated.id?updated:r);if(editorRevision===resident.revision)editorRevision=updated.revision;controls();}catch(error){$('mailStatus').textContent=error.message;controls();}
};
$('cancel').onclick=async()=>{try{await operation({op:'control',id:currentRun.record.spec.id,action:{type:'cancel'}});$('runStatus').textContent='Cancellation requested; waiting for backend confirmation';}catch(error){$('runStatus').textContent=error.message;}};
$('detach').onclick=()=>{detach();connected=false;controls();$('connection').textContent='Viewer detached. Execution continues; connect to reattach.';};
$('ping').onclick=async()=>{try{const response=await fetch('/api/ping',{method:'POST',headers,body:JSON.stringify({...target,message:'hello from Boxen'})});const text=await response.text();if(!response.ok)throw new Error(text);$('pingResult').textContent=text;}catch(error){$('pingResult').textContent=error.message;}};
async function load(){
  let attempt=0;
  while(true)try{
    const response=await fetch('/api/status',{headers,signal:AbortSignal.timeout(12000)});unauthorized(response);if(!response.ok)throw new Error(await response.text());
    const state=await response.json();identity=state.identity;$('identity').textContent=identity;
    $('peer').append(new Option('This machine',identity));for(const peer of state.peers)$('peer').append(new Option(peer.label,peer.key));
    let saved={};try{saved=JSON.parse(localStorage.getItem('boxen-controls')||'{}');}catch{}
    $('peer').value=saved.peer||state.peers[0]?.key||identity;
    $('address').value=saved.address||'';$('cwd').value=saved.cwd||'';$('model').value=saved.model||'';selectedThread=saved.thread||'';
    $('addressLabel').hidden=$('peer').value===identity;
    $('connection').textContent='Select a machine and connect.';controls();
    if($('peer').value===identity||$('address').value)connect();
    return;
  }catch(error){$('connection').textContent=error.authorization?error.message:'Local daemon unreachable; reconnecting… '+error.message;controls();if(error.authorization)return;await pause(Math.min(500*2**attempt++,5000));}
}
load();
</script>
