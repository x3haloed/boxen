[package]
name = "boxen-guest-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
font8x8 = "=0.3.1"
# 5.0.1 forwards macOS close requests to the client as EVENT_CLOSE.
softer_gui = { version = "=5.0.1", git = "https://github.com/ShieldedLabs/softer_gui", rev = "de63f083ea670b4e453710863c83e3d9a03d9906" }

[features]
ape = ["dep:cosmo-build"]

[build-dependencies]
cosmo-build = { version = "=10.0.0", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = "=10.0.0"

[package.metadata.cosmo]
bin = "boxen-guest-client"

[workspace]
