[package]
name = "boxen-guest-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
font8x8 = "=0.3.1"
softer_gui = "=5.0.0"

[features]
ape = ["dep:cosmo-build"]

[build-dependencies]
cosmo-build = { version = "=10.0.0", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = "=10.0.0"

[package.metadata.cosmo]
bin = "boxen-guest-client"

[workspace]
