[package]
name = "boxen-guest-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
boxen-guest-transport = { path = "transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "=0.13.6", default-features = false }

[target.'cfg(any(not(target_os = "macos"), cosmo))'.dependencies]
fontdue = "=0.9.5"
softer_gui = { path = "vendor/softer_gui" }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.23"
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }

[features]
ape = ["dep:cosmo-build"]

[build-dependencies]
cc = "1"
cosmo-build = { version = "=10.0.0", optional = true }

[target.'cfg(cosmo)'.dependencies]
cosmo-compat = "=10.0.0"

[package.metadata.cosmo]
bin = "boxen-guest-client"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cosmo)'] }

[workspace]
exclude = ["vendor/softer_gui"]
